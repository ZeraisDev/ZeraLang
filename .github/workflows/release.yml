name: Release Zeralang

on:
  push:
    tags:
      - 'v*' # Triggers when you push a tag like "v1.0.0"

permissions:
  contents: write # Required to give the token permission to create the release

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: zeralang
            asset_name: zeralang-linux-amd64
          - os: windows-latest
            artifact_name: zeralang.exe
            asset_name: zeralang-windows-amd64.exe
          - os: macos-latest
            artifact_name: zeralang
            asset_name: zeralang-macos-amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release

      # Rename the file so it has a clear name for the release
      - name: Rename binary
        shell: bash
        run: |
          mv target/release/${{ matrix.artifact_name }} target/release/${{ matrix.asset_name }}

      - name: Upload binary to release
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/${{ matrix.asset_name }}