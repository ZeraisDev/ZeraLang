name: Release Zeralang

on:
  push:
    tags:
      - 'v*' # Triggers when you push a tag like "v1.0.0"

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: zeralang
            asset_name: zeralang-linux-amd64
          - os: windows-latest
            artifact_name: zeralang.exe
            asset_name: zeralang-windows-amd64.exe
          - os: macos-latest
            artifact_name: zeralang
            asset_name: zeralang-macos-amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release

      - name: Upload binary to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/release/${{ matrix.artifact_name }}
          asset_name: ${{ matrix.asset_name }}
          tag: ${{ github.ref_name }}
          overwrite: true