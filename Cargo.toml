[package]
name = "zera_lang"
version = "0.1.0"
edition = "2024"

[lib]
name = "zera_lang"
path = "src/lib.rs"
# `staticlib` is what the AOT backend links against: it carries the whole
# `zera_*` runtime (value arena, closures, OOP dispatch, builtins, C-FFI).
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "zera_lang"
path = "src/main.rs"

[dependencies]
libloading = "0.8"
serde_json = "1.0"
cranelift = "0.108"
cranelift-module = "0.108"
cranelift-object = "0.108"
target-lexicon = "0.12"
cranelift-jit = "0.108"